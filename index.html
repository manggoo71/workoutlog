/* 키보드: 타이머는 하단에 고정, 입력칸은 가려지지 않게 */
const vv=window.visualViewport;
let kbNow=0,sT=0,kbMax=0;
try{kbMax=+localStorage.getItem('wkb')||0}catch(e){}
const est=()=>kbNow>50?kbNow:(kbMax||345);
/* 키보드 윗선: 위에 떠 있는 입력 보조 막대(∧ ∨ ✓) 높이만큼 더 위로 본다 */
const ACC=60;
const kbTop=()=>(kbNow>50&&vv?vv.offsetTop+vv.height:innerHeight-est())-ACC;
const root=document.documentElement;
function dkSet(v){root.style.setProperty('--dk',Math.max(0,v)+'px')}
document.addEventListener('focusout',e=>{if(e.target&&e.target.id==='dt')setTimeout(()=>{if(document.activeElement!==$('#dt'))dkSet(0)},60)},true);
/* 떠 있는 타이머 높이 + 아래 간격 + 여유를 목록 하단 여백으로 */
const GP=40;
function pbv(){const t=$('#tw');if(!t)return 40;return Math.round(t.offsetHeight+(parseFloat(getComputedStyle(t).bottom)||0)+GP)}
function syncPb(){root.style.setProperty('--pb',pbv()+'px')}
if(window.ResizeObserver)new ResizeObserver(syncPb).observe($('#tw'));addEventListener('resize',syncPb);syncPb();
function setPad(p){
  p=p||curPs();if(!p)return;
  const pr=p.getBoundingClientRect(),kt=kbTop();
  root.style.setProperty('--kp',Math.max(0,Math.round(pr.bottom-kt+24-pbv()))+'px');
}
/* 목록 스크롤: 브라우저 기본 부드러운 스크롤을 사용(입력 커서가 함께 움직임) */
function smoothTo(p,to){
  if(!p)return;
  to=Math.max(0,Math.min(p.scrollHeight-p.clientHeight,Math.round(to)));
  if(Math.abs(to-p.scrollTop)<1)return;
  if(!DUR||!p.scrollTo){p.scrollTop=to;return}
  p.scrollTo({top:to,behavior:'smooth'});
}
const curPs=()=>{const pn=panels&&panels[cur];return pn&&pn.querySelector('.ps')};
let idle=false,idleT=0,relRaf=0;
/* 키보드가 내려가면: 남는 여백만큼 먼저 부드럽게 올려 놓은 뒤 여백을 걷어낸다(순간이동 없음) */
function hardRelease(){
  idle=false;clearTimeout(idleT);cancelAnimationFrame(relRaf);
  const a=document.activeElement;if(a&&a.matches&&a.matches('w-in,input,textarea'))return;
  root.style.removeProperty('--kp');root.style.setProperty('--kb','0px');root.classList.remove('kbo');
}
function release(){
  idle=false;clearTimeout(idleT);cancelAnimationFrame(relRaf);
  root.classList.remove('kbo');
  const p=curPs(),done=()=>{root.style.removeProperty('--kp');root.style.setProperty('--kb','0px')};
  if(!p){done();return}
  const pad=parseFloat(getComputedStyle(p).paddingBottom)||0,extra=Math.max(0,pad-pbv());
  const max=p.scrollHeight-p.clientHeight-extra;
  if(extra<1||p.scrollTop<=max+1||!DUR){done();return}
  smoothTo(p,max);
  const t0=performance.now();
  const wait=()=>{
    if(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('w-in'))return;
    if(p.scrollTop<=max+1||performance.now()-t0>900){if(p.scrollTop>max+1)p.scrollTop=max;done();return}
    relRaf=requestAnimationFrame(wait);
  };
  relRaf=requestAnimationFrame(wait);
}
/* 입력칸을 '상단 탭 아래 ~ 키보드 위' 영역의 가운데로 */
function bring(el,force,soft){
  const p=el.closest('.ps');if(!p)return;
  if(soft){
    const r=el.getBoundingClientRect(),pr=p.getBoundingClientRect();
    const kt=kbTop();
    if(r.top>=pr.top+12&&r.bottom<=kt-20)return;
  }
  if(!force&&p._be===el&&performance.now()-p._bt<450)return;
  p._be=el;p._bt=performance.now();
  setPad(p);
  const r=el.getBoundingClientRect(),pr=p.getBoundingClientRect();
  const bottom=kbTop();
  const d=(r.top+r.bottom)/2-(pr.top+Math.min(bottom,pr.bottom))/2;
  if(Math.abs(d)<3)return;
  smoothTo(p,p.scrollTop+d);
}
const hard=t=>{
  if(!t||!t.setAttribute||t._h)return;
  if(t.matches&&t.matches('input,textarea,w-in')){
    t.setAttribute('autocomplete','off');t.setAttribute('autocorrect','off');
    t.setAttribute('autocapitalize','off');t.setAttribute('spellcheck','false');
    t.setAttribute('data-lpignore','true');t.setAttribute('data-form-type','other');
    t._h=1;
  }
};
document.addEventListener('touchstart',e=>hard(e.target),{capture:true,passive:true});
document.addEventListener('focusin',e=>{
  hard(e.target);
  if(e.target.matches&&e.target.matches('input,textarea,w-in')){idle=false;clearTimeout(idleT);root.classList.add('kbo')}
},true);
document.addEventListener('focusout',e=>{
  const n=e.relatedTarget;
  if(n&&n.matches&&n.matches('input,textarea,w-in'))return;
  setTimeout(()=>{
    const a=document.activeElement;
    if(a&&a.matches&&a.matches('input,textarea,w-in'))return;
    root.classList.remove('kbo');
    if(tabMove)return;
    release();
  },0);
},true);
function pin(){
  if(!vv)return;
  const off=Math.max(0,vv.offsetTop),kb=Math.max(0,innerHeight-vv.height-off);
  {const a=document.activeElement,ed=a&&a.matches&&a.matches('input,textarea,w-in');root.style.setProperty('--kb',(ed?kb:0)+'px')}
  document.body.style.transform=off?'translate3d(0,'+off+'px,0)':'';
  if(scrollY||scrollX)scrollTo(0,0);
  const was=kbNow;kbNow=kb;
  if(document.activeElement&&document.activeElement.id==='dt'&&kb>200&&Math.abs(kb-parseFloat(getComputedStyle(root).getPropertyValue('--dk')||0))>24)dkSet(kb);
  if(was>=50&&kb<50){
    /* 키보드가 닫혔으면 포커스 상태와 상관없이 정리(타이머 복귀·여백 해제) */
    const a=document.activeElement;
    if(a&&a.matches&&a.matches('w-in,input,textarea')&&a.closest('.ps'))a.blur();
    dkSet(0);
    if(!tabMove)release();
  }else if(idle&&kb<50)release();
  if(kb>200&&Math.abs(kb-was)>20){
    const same=Math.abs(kb-(kbMax||345))<14&&was<50;
    kbMax=kb;try{localStorage.setItem('wkb',kb)}catch(e){}
    const a=document.activeElement;
    if(!same&&a&&a.matches&&a.matches('w-in')&&a.closest('.ps')){clearTimeout(sT);sT=setTimeout(()=>{if(document.activeElement===a)bring(a,1)},80)}
  }
}
if(vv){vv.addEventListener('resize',pin);vv.addEventListener('scroll',pin)}
addEventListener('scroll',()=>{if(scrollY||scrollX)scrollTo(0,0)});
/* 탭 아래로 스크롤되는 목록은 페이드 아웃 */
pg.addEventListener('scroll',ev=>{const p=ev.target;if(p.classList&&p.classList.contains('ps'))p.classList.toggle('sc',p.scrollTop>4)},true);
const SQ='.f w-in,.ad w-in,#dt,nav button,#tbi,.c,.ib2.sm,.m label,.ib2,.ad button,.sh,.db button,.sg,.mn button,.tf';
const sqro=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>{
  const t=e.target,b=Array.isArray(e.borderBoxSize)?e.borderBoxSize[0]:e.borderBoxSize;
  t.style.setProperty('--w',(b?b.inlineSize:t.offsetWidth)+'px');
  t.style.setProperty('--h',(b?b.blockSize:t.offsetHeight)+'px');
})):null;
function sqobs(r){
  if(!sqro||!r.querySelectorAll)return;
  if(r.matches&&r.matches(SQ))sqro.observe(r);
  r.querySelectorAll(SQ).forEach(n=>sqro.observe(n));
}
sqobs(document);
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)sqobs(n)}))).observe(document.body,{childList:true,subtree:true});
</script>
