<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.3 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,w-in{font:inherit;color:var(--tx);border:0;outline:0;background:var(--in);--r:12px;border-radius:var(--r);min-width:0}
header{background:var(--bg);padding:6px 12px 0}
.top{display:flex;align-items:center;height:48px}
.ti{font-size:24px;font-weight:900;padding:8px 10px 8px 0;margin-left:8px}
.fl{flex:1}
.pl{width:140px;flex:none}

nav button.on{color:#fff}
body{timeline-scope:--pg}
#pg{scroll-timeline:--pg x}
@keyframes tbm{from{transform:translate3d(var(--x0),0,0)}to{transform:translate3d(var(--x1),0,0)}}
#tbi.sd{animation:tbm 1s linear both;animation-timeline:--pg}
#tbi{position:absolute;left:0;top:4px;height:46px;width:0;--r:12px;border-radius:var(--r);background:var(--ac);will-change:transform;pointer-events:none;transition:transform var(--d) var(--e)}
#pg{position:relative;z-index:1;flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#pg::-webkit-scrollbar{display:none}
.pn{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;overflow:hidden;padding:0 12px}
.ps::-webkit-scrollbar{display:none;width:0;height:0}
.ps{scrollbar-width:none;position:relative;overflow-anchor:none;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--pb,124px) + var(--kp,0px))}
.gt{margin:14px 4px 8px;font-size:15px;font-weight:700;color:var(--mu)}
.c{position:relative;background:var(--cd);--r:calc(var(--rb) + var(--cp));border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:transform .34s cubic-bezier(.3,0,.2,1)}
.c.rm{pointer-events:none}
.h{display:flex;align-items:center;gap:6px;padding:10px 10px 0 16px;min-height:64px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.t{flex:1;min-width:0}
.t b{display:block;font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t small{display:flex;align-items:center;gap:5px;margin-top:2px;color:var(--mu);font-size:14px;font-weight:600}
.ib2.sm{width:42px;height:42px;--r:12px;border-radius:var(--r)}
.ib2.gh{background:none;transition:opacity .28s cubic-bezier(.25,1,.5,1)}

.ib2.dis:active{opacity:.28}
.tr{display:inline-flex;align-items:center}
.tr.up{color:var(--dg)}
.tr.dn{color:var(--ac)}

.m{display:flex;gap:8px;padding:6px var(--cp) var(--cp)}
.m label{flex:1;display:flex;align-items:center;gap:8px;background:var(--in);--r:var(--rb);border-radius:var(--r);padding-left:12px;color:var(--mu);font-size:13px;white-space:nowrap}
.m w-in{line-height:40px;flex:1;width:100%;height:40px;background:transparent;border-radius:0;padding:0 10px 0 0;font-size:16px;font-weight:600}
/* 칸 가운데에 맞추기(아이폰 화면에서 잰 값): 이름은 0.5pt 아래로, 빈 값 표시(-)는 1.33pt 위로 */
.m .ml{display:block;transform:translateY(.5px)}
.m w-in:empty::before{display:inline-block;transform:translateY(-1.33px)}
.ss{display:grid;grid-template-rows:0fr;visibility:hidden}
.c.o .ss{grid-template-rows:1fr;visibility:visible}
.si{overflow:hidden;min-height:0;opacity:0}
.c.o .si{opacity:1}
/* 움직이는 동안: 카드 자체 배경 대신 조각 배경, 세트 목록은 잘라내는 상자 */
.c.fl{background:transparent;clip-path:none;overflow:visible;isolation:isolate}
.c.fl .ss{grid-template-rows:1fr;visibility:visible;overflow:hidden}
.c.fl .si{opacity:1}
.cq{display:none;position:absolute;left:0;top:0;width:100%;background:var(--cd);pointer-events:none;z-index:-1;transform-origin:0 0}
.c.fl .cq{display:block}
.sp{border-top:1px solid var(--ln);padding:10px var(--cp) var(--cp)}
.sl{counter-reset:s}
.r{counter-increment:s;display:grid;grid-template-columns:26px 1fr 24px 1fr 24px 52px;align-items:start;gap:4px;margin-bottom:8px}
.r.rm{counter-increment:none;pointer-events:none}
.r.rm .n::before{content:attr(data-k)}
.n::before{content:counter(s)}
.r .n{color:var(--mu);font-weight:700;text-align:center;line-height:54px;transition:color .25s cubic-bezier(.25,1,.5,1)}
.r.cur .n{color:var(--ac)}
.r.cur .f w-in{background:var(--ac2)}
.r u{text-decoration:none;color:var(--mu);font-size:13px;line-height:54px}
.f{position:relative;display:flex;flex-direction:column;min-width:0}
.f .hit{position:absolute;inset:0;z-index:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:text}

.f w-in:empty::before{color:var(--mu);opacity:.5;font-weight:600;position:absolute;left:0;right:0;top:0;text-align:center}
.f w-in.phz:empty::before{animation:phz .32s .12s cubic-bezier(.3,0,.2,1) backwards}
@keyframes phz{from{opacity:0}}
.pz{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:3}
.pz .gh{position:absolute;left:0;top:0;display:block;text-align:center;white-space:nowrap}
.pz i{position:absolute;display:block;border-radius:50%}
.f w-in{position:relative;caret-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}
.f w-in:focus::after{content:"";display:inline-block;width:2px;height:.94em;margin:0 -1px;vertical-align:-.11em;border-radius:1px;background:var(--ac);animation:cb 1.06s ease-in-out infinite}
.f w-in:not(:empty):focus::after{margin:0 -3px 0 1px}
.f w-in.ty:focus::after{animation-name:cb2}
.f w-in.ch::after{visibility:hidden}
@keyframes cb{0%,45%{opacity:1}55%,92%{opacity:0}100%{opacity:1}}
@keyframes cb2{0%,45%{opacity:1}55%,92%{opacity:0}100%{opacity:1}}
.ib2{width:52px;height:52px;flex:none;--r:var(--rb);border-radius:var(--r);background:var(--in);color:var(--mu);display:flex;align-items:center;justify-content:center}
.ib2.pls{color:var(--ac)}
.ib2:active{opacity:.7}
.bt{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}
.ad{position:relative;display:flex;margin-top:4px}
.ad w-in{line-height:52px;flex:1;height:52px;padding:0 22px;--r:26px;font-size:17px;background:var(--cd)}
.ad.has w-in{padding-right:56px}
.ad button{position:absolute;right:0;top:0;width:52px;height:52px;padding:0;background:none;color:var(--ac);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);visibility:hidden;transition:opacity var(--d) var(--e),transform var(--d) var(--e),visibility 0s linear var(--d)}
.ad.has button{opacity:1;transform:none;visibility:visible;transition:opacity var(--d) var(--e),transform var(--d) var(--e),visibility 0s}
.ad.has button:active{opacity:.6}
#dg{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity var(--d) var(--e)}
#dg.on{opacity:1;pointer-events:auto}
#dg.on.hold{pointer-events:none}
.sh{width:100%;max-width:420px;max-height:calc(100% - var(--dk,0px));overflow:auto;background:var(--cd);--r:22px;border-radius:var(--r);padding:20px 16px 16px;transform:translateY(calc(var(--dk,0px) * -.5 + 12px)) scale(.94);transition:transform .46s cubic-bezier(.32,.72,0,1)}
#dg.on .sh,#dg.st .sh{transform:translateY(calc(var(--dk,0px) * -.5))}
#kx,.sn{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 8px);width:2px;height:24px;font-size:16px;opacity:0;pointer-events:none;overflow:hidden;background:none;padding:0;z-index:-1}
#dm{margin:0 0 14px;font-size:17px;font-weight:600}
#dt{display:none;width:100%;height:120px;padding:12px;margin-bottom:14px;font-size:16px;resize:none}
.db{display:flex;gap:8px}
.db button{flex:1;height:52px;--r:14px;border-radius:var(--r);font-weight:700;font-size:17px;background:var(--in)}
.db #dk{background:var(--ac);color:#fff}
.db #dk.dgr{background:var(--dg)}
.db #dd{display:none;color:var(--dg)}
#dt.one{padding:0 14px;line-height:56px;overflow:hidden}
.sgw{flex:none;position:relative;z-index:2;background:var(--bg);padding:4px 0 6px}
.sg{position:relative;display:flex;background:color-mix(in srgb,var(--bg) 93%,#2a3b5c);--r:14px;border-radius:var(--r);padding:4px}
.sg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));--r:10px;border-radius:var(--r);background:var(--cd);transform:translateX(calc(var(--i)*100%));transition:transform var(--d) var(--e)}
.sg button{position:relative;flex:1;height:44px;font-weight:700;font-size:16px;color:var(--mu);transition:color var(--d) var(--e)}
.sg button.on{color:var(--tx)}
.pl button,.sgw .sg button{height:36px;font-size:15px}
.gw.hid{display:none}
.fd{position:sticky;top:0;height:0;z-index:3}
.fd~.gw{padding-top:4px}
/* 상단 페이드: 목록 자체를 알파 마스크로 투명하게(위 끝 0% → 28px에서 100%).
   --fa는 위 끝의 불투명도: 맨 위(스크롤 0)면 1(페이드 없음), 스크롤한 만큼 0까지 연속으로 줄어든다. */
@property --fa{syntax:'<number>';inherits:false;initial-value:1}
.ps{--fa:1;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,var(--fa)) 0,#000 28px);mask-image:linear-gradient(to bottom,rgba(0,0,0,var(--fa)) 0,#000 28px)}
.sg.pl,.sgw .sg{--r:13px}
.sg.pl::before,.sgw .sg::before{--r:9px}
.c.pr{transform:scale(.962);transition:transform .22s cubic-bezier(.3,0,.2,1)}
.mn{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.mn .bk{text-align:center;color:var(--mu);font-size:13px;font-weight:600}
.mn button{height:52px;--r:14px;border-radius:var(--r);background:var(--in);font-weight:700;font-size:17px}

html{background:var(--cd)}
/* 하단 타이머: 배경·그림자를 별도 층으로 두고, 작은 타이머로 변할 때 이 층과 내용이 한 덩어리로 함께 변형된다 */
#tw .tsh,#tw .tbg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#tw .tbg{background:var(--cd);--r:28px}
/* 그림자는 큰 카드용·작은 타이머용을 미리 그려 두고, 전환 중에는 옮기고 늘이며 서로 바꿔 보이기만 한다(매 프레임 흐림 재계산 없음) */
#tw .tsh{transform-origin:0 0;will-change:transform,opacity}
#tw .tsc{border-radius:28px;box-shadow:0 3px 12px var(--sh)}
#tw .tsp{width:64px;height:32px;border-radius:16px;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 3px 12px var(--sh);opacity:0}

   (모든 움직임을 iOS 합성기에 맡겨 120Hz로, 앱이 바빠도 끊기지 않게). 멈춘 큰 타이머는 스쿼클 배경 */
#tw .tbp{position:absolute;left:0;top:0;background:var(--cd);transform-origin:0 0;will-change:transform;pointer-events:none;opacity:0}
#tw .tbc{width:56px;height:56px;border-radius:50%}
html.kpm #tw .tbp{opacity:1}
html.kpm #tw .tbg{opacity:0}
#tw .tf{position:relative}
#tm,#wk,#tw .ib2{will-change:transform}
html.kpm #tw{opacity:1!important}
w-in{display:block;box-sizing:border-box;white-space:nowrap;overflow:hidden;cursor:text;-webkit-user-select:text;user-select:text;-webkit-tap-highlight-color:transparent;caret-color:var(--ac)}
w-in.ch{caret-color:transparent}
w-in:empty::before{content:attr(placeholder);color:var(--mu);opacity:.6;pointer-events:none}
body{overflow:visible}
#tw{transition:opacity .22s cubic-bezier(.25,1,.5,1)}
html.kbo #tw{opacity:0;pointer-events:none}
#fb{position:absolute;left:0;right:0;bottom:0;height:var(--pb,124px);z-index:3;pointer-events:none;background:linear-gradient(to top,var(--bg) 0%,var(--bg) calc(100% - var(--gp)),color-mix(in srgb,var(--bg) 0%,transparent) 100%);transition:opacity .22s cubic-bezier(.25,1,.5,1)}
html.kbo #fb{opacity:0}
.tf{display:grid;grid-template-columns:1fr auto auto;align-items:center;column-gap:8px;padding:12px 12px 12px 18px}
.tl{display:contents}
.spn{display:inline-flex;position:absolute;left:100%;top:50%;margin-top:-10px;width:20px;height:20px;align-items:center;opacity:0;color:var(--mu);transition:opacity .2s}
.spn svg{flex:none;margin-left:6px;animation:spn .9s steps(8) infinite}

html.bkp #wk{pointer-events:none}
#tm{transition:color .2s}#tm.z{color:var(--mu)}
#wk.on{color:var(--tx)}
@keyframes spn{to{transform:rotate(360deg)}}
#tm{transform-origin:0 0;grid-column:1;grid-row:1;font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1}
#wk{display:inline-flex;align-items:center;grid-column:1;grid-row:2;justify-self:start;position:relative;top:-4px;margin-top:2px;margin-left:3px;font-variant-numeric:tabular-nums;padding:4px 0;font-size:14px;font-weight:600;color:var(--mu);line-height:1}
.tf .ib2{grid-row:1;width:56px;height:56px;--r:16px}
#tr{grid-column:3}
#ts{grid-column:2;background:var(--ac);color:#fff}
#ts.run{background:var(--ac2);color:var(--ac)}
#tr:disabled svg{opacity:.35}
.ib2:disabled:active{opacity:1}

<header>

pg.addEventListener('scroll',ev=>{const p=ev.target;if(p.classList&&p.classList.contains('ps'))faSet(p)},true);
const SQ='.f w-in,.ad w-in,#dt,nav button,#tbi,.c,.ib2.sm,.m label,.ib2,.ad button,.sh,.db button,.sg,.mn button';
const sqro=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>{
  const t=e.target,b=Array.isArray(e.borderBoxSize)?e.borderBoxSize[0]:e.borderBoxSize;
  t.style.setProperty('--w',(b?b.inlineSize:t.offsetWidth)+'px');
  t.style.setProperty('--h',(b?b.blockSize:t.offsetHeight)+'px');
})):null;
function sqobs(r){
  if(!sqro||!r.querySelectorAll)return;
  if(r.matches&&r.matches(SQ))sqro.observe(r);
  r.querySelectorAll(SQ).forEach(n=>sqro.observe(n));
}
sqobs(document);
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){sqobs(n)}}))).observe(document.body,{childList:true,subtree:true});
</script>
